# Render Blueprint: requiere configuración manual de ALANTIS_API_KEY.
# IMPORTANTE: PostgreSQL 0.1c-256mb es DE PAGO; confirma coste antes de crear recursos.
services:
  - type: web
    name: alantis-ai-community
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alantis-ai-db
          property: connectionString
      - key: ALANTIS_PROVIDER
        value: openai
      - key: ALANTIS_MODEL
        value: gpt-4o-mini
      - key: ALANTIS_API_URL
        value: https://api.openai.com/v1
      - key: ALANTIS_API_KEY
        sync: false
      - key: ALANTIS_COOKIE_SECURE
        value: 'true'
      - key: ALANTIS_REGISTRATION_OPEN
        value: 'false' # abrir cuando se complete el checklist de seguridad
      - key: ALANTIS_DAILY_LIMIT
        value: '20'
databases:
  - name: alantis-ai-db
    plan: 0.1c-256mb