services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://alantis:change_me@postgres:5432/alantis
      ALANTIS_COOKIE_SECURE: "false" # solo localhost
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alantis
      POSTGRES_USER: alantis
      POSTGRES_PASSWORD: change_me # cambia esto antes de desplegar fuera del PC
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alantis -d alantis"]
      interval: 5s
      retries: 10
volumes:
  db_data: